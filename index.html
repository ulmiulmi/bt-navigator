<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIV Navigator</title>

  <style>
    :root {
      --blue: #00a3e0;
      --blue-dark: #007db3;
      --orange: #d97900;
      --orange-soft: #fff4e5;
      --line: #d8e1e6;
      --text: #3e4b55;
      --muted: #6f7d86;
      --tree-bg: #f2f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #ffffff;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 310px 1fr;
      grid-template-rows: 48px 1fr;
    }

    .top {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      color: #4a555c;
    }

    .logo-mark {
      font-weight: 900;
      font-size: 1.1rem;
      color: #111;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #52606a;
      font-size: 1.05rem;
      white-space: nowrap;
    }

    .user {
      font-size: 0.9rem;
      color: #34434d;
    }

    .sidebar {
      grid-row: 2;
      background: var(--tree-bg);
      border-right: 1px solid var(--line);
      min-height: calc(100vh - 48px);
    }

    .sidebar-title {
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .tree-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 13px;
      height: 40px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: #4b697a;
      font-size: 1.15rem;
      background: #eef3f6;
    }

    .tree {
      padding: 14px 10px;
      font-size: 0.95rem;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 31px;
      color: #34434d;
    }

    .arrow {
      color: #75848d;
      width: 14px;
      text-align: center;
    }

    .folder {
      color: var(--orange);
      font-size: 1.1rem;
    }

    .main {
      grid-row: 2;
      min-width: 0;
      background: #ffffff;
    }

    .page-title {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: white;
      font-weight: 700;
      font-size: 1.08rem;
    }

    .page-title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-icon {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1rem;
      opacity: 0.95;
    }

    .content {
      padding: 42px 54px;
      max-width: 900px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 34px;
    }

    .tile {
      min-height: 150px;
      border: 1px solid #e0e6e9;
      background: white;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px 12px;
      transition: 0.15s ease;
    }

    .tile:hover,
    .tile:focus-visible {
      outline: none;
      border-color: var(--orange);
      background: var(--orange-soft);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(120, 84, 33, 0.12);
    }

    .tile-icon {
      font-size: 3rem;
      line-height: 1;
      color: var(--orange);
      margin-bottom: 12px;
    }

    .tile-title {
      font-size: 1rem;
      line-height: 1.18;
      color: #53616a;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 48px auto 1fr;
      }

      .sidebar {
        grid-row: 2;
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .tree {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 2px 12px;
      }

      .main {
        grid-row: 3;
      }

      .content {
        padding: 28px 22px;
        max-width: none;
      }
    }

    @media (max-width: 640px) {
      .top {
        padding: 0 10px;
      }

      .top-icons {
        gap: 8px;
        font-size: 0.95rem;
      }

      .user {
        display: none;
      }

      .tree {
        grid-template-columns: 1fr;
      }

      .tiles {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .tile {
        min-height: 112px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="logo" aria-label="LIV Navigator">
        <span class="logo-mark">L!V</span>
        <span>Navigator</span>
      </div>

      <div class="top-icons">
        <span>⌂</span>
        <span>☑</span>
        <span>▣</span>
        <span class="user">ULMANN ANDREAS</span>
        <span>⚙</span>
        <span>?</span>
        <strong>L!V</strong>
      </div>
    </header>

    <aside class="sidebar">
      <div class="sidebar-title">Struktur</div>
      <div class="tree-tools" aria-hidden="true">
        <span>▣</span>
        <span>☆</span>
        <span>⌕</span>
        <span>«</span>
      </div>

      <nav class="tree" aria-label="Struktur">
        <div class="tree-row">
          <span class="arrow">▾</span>
          <span class="folder">📂</span>
          <span>Prozessübersicht</span>
        </div>
        <div class="tree-row">
          <span class="arrow"></span>
          <span class="arrow">▸</span>
          <span class="folder">📁</span>
          <span>1 Führungsprozesse</span>
        </div>
        <div class="tree-row">
          <span class="arrow"></span>
          <span class="arrow">▸</span>
          <span class="folder">📁</span>
          <span>2 Supportprozesse</span>
        </div>
        <div class="tree-row">
          <span class="arrow"></span>
          <span class="arrow">▸</span>
          <span class="folder">📁</span>
          <span>3 Kernprozesse</span>
        </div>
      </nav>
    </aside>

    <main class="main">
      <div class="page-title">
        <div class="page-title-left">
          <span class="page-icon">▦</span>
          <span>Startseite</span>
        </div>
        <div class="page-actions" aria-hidden="true">
          <span>ⓘ</span>
          <span>⎙</span>
          <span>↗</span>
          <span>✉</span>
          <span>☆</span>
        </div>
      </div>

      <section class="content">
        <nav class="tiles" aria-label="Hauptbereiche">
          <a class="tile" href="https://ulmiulmi.github.io/bt-navigator/BT_Navigator.html">
            <div class="tile-icon" aria-hidden="true">🧭</div>
            <div class="tile-title">LIV<br>Navigator</div>
          </a>

          <a class="tile" href="https://ulmiulmi.github.io/bt-navigator/klientendatei_viewer.html">
            <div class="tile-icon" aria-hidden="true">📋</div>
            <div class="tile-title">Klienten-<br>datei</div>
          </a>

          <a class="tile" href="https://ulmiulmi.github.io/bt-navigator/ret_tz_wochenplan.html">
            <div class="tile-icon" aria-hidden="true">📅</div>
            <div class="tile-title">RET/TZ<br>Wochenplan</div>
          </a>
        </nav>
      </section>
    </main>
  </div>
</body>
</html>
