<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BT Arbeitsübersicht</title>

  <style>
    :root {
      --blue: #00a3e0;
      --blue-dark: #007db3;
      --orange: #d97900;
      --orange-soft: #fff4e5;
      --line: #d8e1e6;
      --text: #3e4b55;
      --muted: #6f7d86;
      --tree-bg: #f2f5f7;
      --card-bg: #ffffff;
      --card-border: #dfe7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #ffffff;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 310px 1fr;
      grid-template-rows: 74px 1fr;
    }

    .top {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      padding: 8px 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }

    .brand-logo {
      display: block;
      width: min(470px, 62vw);
      height: auto;
      border-radius: 16px;
      flex: 0 1 auto;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #52606a;
      font-size: 1.02rem;
      white-space: nowrap;
      margin-left: 12px;
      flex: 0 0 auto;
    }

    .user {
      font-size: 0.86rem;
      color: #34434d;
    }

    .sidebar {
      grid-column: 1;
      grid-row: 2;
      background: var(--tree-bg);
      border-right: 1px solid var(--line);
      min-height: calc(100vh - 74px);
    }

    .sidebar-title {
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .tree-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 13px;
      height: 40px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: #4b697a;
      font-size: 1.15rem;
      background: #eef3f6;
    }

    .tree {
      padding: 14px 10px;
      font-size: 0.95rem;
    }

    .tree-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-height: 34px;
      color: #34434d;
      text-decoration: none;
      padding-top: 3px;
    }

    .tree-row:hover { color: var(--orange); }

    .arrow {
      color: #75848d;
      width: 14px;
      text-align: center;
      flex: 0 0 auto;
    }

    .folder {
      color: var(--orange);
      font-size: 1.1rem;
      flex: 0 0 auto;
    }

    .tree-text {
      overflow-wrap: anywhere;
      line-height: 1.2;
    }

    .main {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      background: #ffffff;
    }

    .page-title {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: white;
      font-weight: 700;
      font-size: 1.08rem;
      gap: 10px;
    }

    .page-title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .page-icon {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      font-size: 0.9rem;
      flex: 0 0 auto;
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      flex: 0 0 auto;
    }

    .page-actions a {
      color: white;
      text-decoration: none;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 3px;
      white-space: nowrap;
    }

    .page-actions a:hover { background: rgba(255,255,255,0.16); }

    .content {
      padding: 42px 54px;
      max-width: 980px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 28px;
      margin-bottom: 28px;
    }

    .tile {
      min-height: 170px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 16px;
      transition: 0.15s ease;
    }

    a.tile:hover,
    a.tile:focus-visible {
      outline: none;
      border-color: var(--orange);
      background: var(--orange-soft);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(120, 84, 33, 0.12);
    }

    .tile-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #f2f7fa;
      border: 1px solid #dde7ec;
      color: #5a6871;
      font-size: 0.83rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .tile-title {
      font-size: 1.15rem;
      line-height: 1.2;
      color: #46555f;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tile-sub {
      font-size: 0.92rem;
      line-height: 1.35;
      color: var(--muted);
    }

    .box {
      border: 1px solid #e0e6e9;
      background: #ffffff;
      padding: 20px 22px;
      margin-bottom: 18px;
    }

    .box h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
      color: #44525c;
    }

    .box p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    .file-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    input[type="file"] {
      min-height: 42px;
      border: 1px solid var(--line);
      padding: 8px;
      width: 100%;
      background: white;
    }

    .button {
      min-height: 42px;
      border: 1px solid var(--orange);
      background: var(--orange);
      color: white;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .viewer {
      border: 1px solid #e0e6e9;
      background: #f8fafb;
      min-height: 360px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 560px;
      border: 0;
      background: white;
    }

    .small {
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 210px 1fr;
      }

      .content {
        padding: 28px 22px;
        max-width: none;
      }

      .tiles {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .tile {
        min-height: 130px;
      }
    }

    @media (max-width: 640px) {
      .app {
        grid-template-columns: 138px 1fr;
        grid-template-rows: 62px 1fr;
      }

      .top {
        min-height: 62px;
        padding: 6px 8px;
      }

      .brand-logo {
        width: min(300px, 68vw);
        border-radius: 12px;
      }

      .top-icons {
        gap: 8px;
        font-size: 0.95rem;
        margin-left: 6px;
      }

      .user,
      .top-icons span:nth-child(2),
      .top-icons span:nth-child(3),
      .top-icons span:nth-child(5),
      .top-icons span:nth-child(6) {
        display: none;
      }

      .sidebar {
        min-height: calc(100vh - 62px);
      }

      .sidebar-title {
        height: 38px;
        font-size: 0.95rem;
        padding: 0 8px;
      }

      .tree-tools {
        height: 34px;
        gap: 7px;
        padding: 0 7px;
        font-size: 0.9rem;
      }

      .tree {
        padding: 10px 6px;
        font-size: 0.82rem;
      }

      .tree-row {
        gap: 4px;
        min-height: 35px;
      }

      .arrow { width: 10px; }
      .folder { font-size: 0.95rem; }

      .page-title {
        align-items: flex-start;
        flex-direction: column;
        padding: 8px 10px;
        gap: 7px;
        font-size: 0.96rem;
      }

      .page-actions {
        gap: 6px;
        font-size: 0.8rem;
        flex-wrap: wrap;
      }

      .page-actions a {
        padding: 4px 6px;
      }

      .content {
        padding: 14px 10px 24px;
      }

      .tile {
        min-height: 110px;
        padding: 14px 10px;
      }

      .tile-badge {
        min-height: 26px;
        font-size: 0.74rem;
        margin-bottom: 10px;
      }

      .tile-title {
        font-size: 1rem;
        margin-bottom: 5px;
      }

      .tile-sub {
        font-size: 0.84rem;
      }

      .box {
        padding: 14px 12px;
      }

      .file-row { grid-template-columns: 1fr; }

      iframe { height: 420px; }
    }
  </style>

</head>
